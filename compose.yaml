# papiro — Postgres + API + crawler na VM (.agents/docs/docker-postgres.md)
#
#   docker compose --env-file .env/docker.env up -d   # sobe db + api
#   docker compose --env-file .env/docker.env run --rm crawler \
#     python -m crawler.db sync          # popula o banco a partir dos shards
#   docker compose --env-file .env/docker.env run --rm crawler \
#     python -m crawler next --probe 30
#
# Variáveis: ficam no agregado `.env/docker.env` (KEY=VAL) — o compose exige
# `--env-file` porque `.env/` é diretório; alternativa: exportar no shell.
# Esperadas: POSTGRES_PASSWORD, POSTGRES_RO_PASSWORD, FIRECRAWL_API_KEY.
# Opcionais do agente: GEMINI_API_KEY, GEMINI_MODEL, GEMINI_FALLBACK_MODEL,
# GEMINI_THINKING_LEVEL, GEMINI_FALLBACK_THINKING_LEVEL (ausentes → /agente
# responde 503 ou usa defaults, resto da API sobe normal) e
# TRUSTED_PROXY_IPS (CIDRs que podem injetar cf-connecting-ip — default
# loopback+privadas; ver .agents/docs/deploy-gcp.md §invariante de topologia).
# O crawler roda sob o profile `crawler` (one-shot por comando); na VM o loop
# de ingest fica em cron/systemd timer chamando `compose run` — restart-loop
# direto no compose reexecutaria `next` em busy-loop sem efeito.

services:
  db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: papiro
      POSTGRES_USER: papiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (ver .env/)}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD:?defina POSTGRES_RO_PASSWORD (ver .env/)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro   # só executa em volume novo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papiro"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    # nome remoto (Artifact Registry) via PAPIRO_IMAGE — default local `papiro`
    image: ${PAPIRO_IMAGE:-papiro}
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://papiro_ro:${POSTGRES_RO_PASSWORD}@db:5432/papiro
      CORS_ORIGINS: ${CORS_ORIGINS:-https://olavostauros.github.io}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-}
      GEMINI_FALLBACK_THINKING_LEVEL: ${GEMINI_FALLBACK_THINKING_LEVEL:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # túnel alcança api:8000 pela rede interna; publish só p/ debug local

  crawler:
    build: .
    image: ${PAPIRO_IMAGE:-papiro}
    profiles: ["crawler"]
    command: ["python", "-m", "crawler", "next", "--probe", "30"]
    environment:
      DATABASE_URL: postgresql://papiro:${POSTGRES_PASSWORD}@db:5432/papiro
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      PAPIRO_LEDGER: /app/crawler/.cache/FIRECRAWL_USAGE.md
      PAPIRO_WORKDIR: /app/work
    volumes:
      - ./data:/app/data              # shards = backup versionável + insumo do sync
      - ./crawler/jobs:/app/crawler/jobs
      - crawler-cache:/app/crawler/.cache   # PDFs + extrações Firecrawl (créditos!)
      - crawler-work:/app/work              # workdirs de job (/app/work/<evento>)
    depends_on:
      db:
        condition: service_healthy

  # Exposição pública na VM via Cloudflare Tunnel — outbound-only, nenhuma
  # porta de ingress aberta. Tunnel "locally managed" criado via
  # `cloudflared tunnel login/create/route dns` (ver deploy-gcp.md);
  # creds.json (segredo) + config.yml (ingress api.olavostauros.com →
  # http://api:8000) montados de .env/cloudflared/.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./.env/cloudflared:/etc/cloudflared:ro
    depends_on:
      - api

volumes:
  pgdata:
  crawler-cache:
  crawler-work:
