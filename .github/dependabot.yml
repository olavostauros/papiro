version: 2
updates:
  # actions pinadas por SHA — o bump do dependabot preserva o pin
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # tsgo (typescript@7) é binário nativo — @astrojs/check exige ^5||^6
      # (API JS via Volar). Revisitar quando o check suportar o compilador Go.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # digests das base images (Dockerfile + compose.yaml)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # pip propositalmente fora: requirements.lock (--generate-hashes) é
  # regenerado manualmente com `uv pip compile`
