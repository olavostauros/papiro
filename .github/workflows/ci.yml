name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest (crawler + api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # casa com a imagem (Dockerfile: python:3.12-slim)
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements-dev.txt
      - name: poppler (pdftotext/pdftohtml p/ testes de parser)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pip install -r crawler/requirements-dev.txt
      - run: python -m pytest crawler/tests tests -q

  web:
    name: astro (check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  docker:
    name: build da imagem papiro
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # no checkout .agents/ é blob git-crypt com nomes ofuscados — o
      # Dockerfile precisa de .agents/agents/auditor.md destravado.
      # secrets.GIT_CRYPT_KEY = base64 da chave simétrica break-glass
      # (.env/git-crypt/papiro.key); PRs de fork sem secrets falham aqui
      # (fail-closed).
      - name: Unlock .agents (git-crypt)
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-crypt
          key="$RUNNER_TEMP/papiro.key"
          printf %s "$GIT_CRYPT_KEY" | base64 -d > "$key"
          git crypt unlock "$key"
          rm -f "$key"
      - run: python3 scripts/deobfuscate_agents.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: papiro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dataset:
    name: shards + segredos + git-crypt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # python3 do runner basta — os gates são stdlib-only
      - run: python3 scripts/check_dataset.py
      - run: python3 scripts/check_gitcrypt.py
