name: Imagem papiro

# Builda a imagem única (api + crawler) a cada mudança relevante em master e,
# quando o WIF estiver provisionado, empurra para o Artifact Registry —
# a VM então atualiza com `docker compose pull && up -d` (pull-based, sem
# inbound). Provisionamento do WIF: .agents/docs/deploy-gcp.md §"CI — imagem".

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - crawler/**
      - api/**
      - .agents/**
      - .github/workflows/image.yml
  workflow_dispatch:

# a fila serializa publicações — uma nova espera a anterior terminar
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  build:
    name: build (valida Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # no checkout .agents/ é blob git-crypt com nomes ofuscados — o
      # Dockerfile precisa de .agents/prod-agents/auditor.md destravado.
      # secrets.GIT_CRYPT_KEY = base64 da chave simétrica break-glass
      # (.env/git-crypt/papiro.key).
      - name: Unlock .agents (git-crypt)
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-crypt
          key="$RUNNER_TEMP/papiro.key"
          printf %s "$GIT_CRYPT_KEY" | base64 -d > "$key"
          git crypt unlock "$key"
          rm -f "$key"
      - run: python3 scripts/deobfuscate_agents.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: papiro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    name: push ao Artifact Registry
    needs: build
    # inerte até o operador provisionar o WIF e setar as vars
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC p/ Workload Identity Federation (keyless)
    env:
      IMAGE: southamerica-east1-docker.pkg.dev/papiro-stauros/papiro/papiro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mesmo unlock do job build — o artefato publicado precisa do
      # auditor.md de verdade (ver comentário no job build)
      - name: Unlock .agents (git-crypt)
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-crypt
          key="$RUNNER_TEMP/papiro.key"
          printf %s "$GIT_CRYPT_KEY" | base64 -d > "$key"
          git crypt unlock "$key"
          rm -f "$key"
      - run: python3 scripts/deobfuscate_agents.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Auth GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Docker login no Artifact Registry
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet
      # build limpo, sem cache-from: artefato publicado não herda cache
      # (defesa contra cache-poisoning)
      - name: Push :latest + :<sha>
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
